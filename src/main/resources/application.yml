spring:
  application:
    name: store-tracker
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    serialization:
      write-dates-as-timestamps: false

  jpa:
    # Fail loudly when lazy loading happens outside a transaction instead of
    # silently relying on the Open Session In View anti-pattern.
    open-in-view: false

server:
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "health"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  group-configs:
    - group: store-tracker
      paths-to-match: /api/**
      packages-to-scan: com.store.tracker.visits.controller

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    # Intentionally empty rather than defaulted: ApplicationProperties rejects a
    # blank password at startup with a clear binding error.
    password: ${ADMIN_PASSWORD:}

# Local development against the PostgreSQL instance started by:
#
#   docker compose up -d postgres
#   SPRING_PROFILES_ACTIVE=postgres ADMIN_PASSWORD=devpass mvn spring-boot:run
#
# The defaults match docker-compose.yml; override them with DB_URL,
# DB_USERNAME and DB_PASSWORD when your instance differs.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/store_tracker}
    username: ${DB_USERNAME:tracker}
    password: ${DB_PASSWORD:tracker}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
